<header class="site-header">
  <div class="wrapper header-inner">
    <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="page-link" href="{{ site.baseurl }}/" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a class="page-link" href="{{ '/projects/' | prepend: site.baseurl }}" {% if page.url == '/projects/' %}aria-current="page"{% endif %}>Projects</a>
      <a class="page-link" href="{{ '/about/' | prepend: site.baseurl }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Toggle light mode" aria-pressed="false" hidden><span aria-hidden="true">◐</span> <span class="theme-label">Light mode</span></button>
  </div>
</header>
